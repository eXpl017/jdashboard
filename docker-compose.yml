# Runs the dashboard with the image built from ./Dockerfile.
#
#   docker compose build
#   docker compose up -d
#   open http://127.0.0.1:8000
#
# Values below can be overridden in .env (Compose reads it automatically).

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: japan-cybersecurity-jobs:latest
    container_name: jdashboard
    restart: unless-stopped

    # Published on the host loopback only; the dashboard has no auth.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8000}:8000"

    environment:
      APP_NAME: "${APP_NAME:-Japan Cybersecurity Jobs}"
      HOST: "0.0.0.0"
      PORT: "8000"
      # Absolute path inside the container; the volume is mounted at /data.
      DATABASE_URL: "sqlite:////data/jobs.db"
      DEFAULT_WINDOW_DAYS: "${DEFAULT_WINDOW_DAYS:-3}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-20}"
      MIN_REQUEST_INTERVAL_SECONDS: "${MIN_REQUEST_INTERVAL_SECONDS:-1.0}"
      MAX_DETAIL_CONCURRENCY: "${MAX_DETAIL_CONCURRENCY:-2}"
      MAX_RETRIES: "${MAX_RETRIES:-2}"
      RETRY_BACKOFF_SECONDS: "${RETRY_BACKOFF_SECONDS:-1.0}"
      USER_AGENT: "${USER_AGENT:-JDashboard/0.1 (personal job dashboard; +http://127.0.0.1:8000)}"
      ENABLE_MICHAEL_PAGE: "${ENABLE_MICHAEL_PAGE:-true}"
      ENABLE_JAPAN_DEV: "${ENABLE_JAPAN_DEV:-true}"
      ENABLE_TOKYO_DEV: "${ENABLE_TOKYO_DEV:-true}"
      ENABLE_DAIJOB: "${ENABLE_DAIJOB:-true}"
      ENABLE_ROBERT_HALF: "${ENABLE_ROBERT_HALF:-true}"

    volumes:
      # Keeps the SQLite database across rebuilds and restarts.
      - dashboard-data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dashboard-data:
